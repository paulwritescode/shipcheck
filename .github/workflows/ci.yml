name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all tracked files for credentials
        run: bash scripts/secret-scan.sh --all

  backend:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)" || (echo 'gofmt needed:'; gofmt -l cmd internal; exit 1)
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Build
        run: go build ./cmd/... ./internal/...
      - name: Test
        run: go test ./cmd/... ./internal/...

  lambda-build:
    name: Lambda binary builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Cross-compile Lambda bootstrap (provided.al2023, arm64)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -o /tmp/bootstrap ./cmd/shipcheck

  infra:
    name: CDK stack compiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build CDK app
        run: go build ./...

  web:
    name: React SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
